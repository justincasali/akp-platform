apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: guestbook-helm-rendered
  annotations:
    # Sync before the other Kargo resources so the project namespace exists first.
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  # Must match the Project name and live in the Project's namespace.
  name: guestbook-helm-rendered
  namespace: guestbook-helm-rendered
spec:
  promotionPolicies:
  - stageSelector:
      name: dev
    autoPromotionEnabled: true
